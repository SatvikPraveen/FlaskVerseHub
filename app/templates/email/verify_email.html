{% extends "email/base.html" %}
{% block body %}
<p>Hi {{ user.username }},</p>
<p>Please confirm your email address by clicking the button below. The link is valid for three days.</p>
<p><a href="{{ verify_url }}" style="background:#0d6efd;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none">Verify email</a></p>
<p style="font-size:12px;color:#6c757d">Or copy this link: {{ verify_url }}</p>
{% endblock %}
