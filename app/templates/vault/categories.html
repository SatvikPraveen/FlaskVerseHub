{% extends "base.html" %}
{% block title %}Categories · {{ app_name }}{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h3 mb-3">Categories</h1>
  <div class="row g-3">
    {% for category, count in rows %}
    <div class="col-md-6 col-lg-4">
      <a class="card h-100 text-decoration-none" href="{{ url_for('knowledge_vault.index', category=category.slug) }}">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge rounded-pill" style="background:{{ category.color }}"><i class="fa-solid fa-{{ category.icon }} me-1"></i>{{ category.name }}</span>
            <span class="text-muted small">{{ count }} item{{ 's' if count != 1 }}</span>
          </div>
          <p class="card-text text-muted small mb-0">{{ category.description }}</p>
        </div>
      </a>
    </div>
    {% else %}<p class="text-muted">No categories yet.</p>{% endfor %}
  </div>
</div>
{% endblock %}
