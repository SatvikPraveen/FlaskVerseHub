{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="container flash-messages-container mt-3" role="status" aria-live="polite">
  {% for category, message in messages %}
  {% set level = {'error': 'danger', 'message': 'info'}.get(category, category) %}
  <div class="alert alert-{{ level }} alert-dismissible fade show d-flex align-items-center" role="alert">
    <i class="fa-solid {{ {'success': 'fa-circle-check', 'danger': 'fa-circle-exclamation', 'warning': 'fa-triangle-exclamation'}.get(level, 'fa-circle-info') }} me-2" aria-hidden="true"></i>
    <div class="alert-message flex-grow-1">{{ message }}</div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
