{% extends "base.html" %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="" width="40" height="40" class="mb-2" />
            <h1 class="h4 mb-1">{% block heading %}{% endblock %}</h1>
            <p class="text-muted small mb-0">{% block subheading %}{% endblock %}</p>
          </div>
          {% block card %}{% endblock %}
        </div>
      </div>
      {% block below %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
