<!doctype html>
<html lang="en" data-bs-theme="{{ current_user.theme if current_user.is_authenticated else 'light' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{% block meta_description %}{{ app_name }} — a research-grade Flask reference platform.{% endblock %}" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
    {% block styles %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <a href="#main-content" class="skip-link visually-hidden-focusable">Skip to main content</a>
    {% block header %}{% include "shared/navbar.html" %}{% endblock %}
    <main id="main-content" class="main-content">
      {% include "shared/flash_messages.html" %}
      {% block content %}{% endblock %}
    </main>
    {% block footer %}{% include "shared/footer.html" %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      window.FVH = {
        csrfToken: {{ csrf_token()|tojson }},
        user: {% if current_user.is_authenticated %}{{ current_user.to_dict()|tojson }}{% else %}null{% endif %},
        urls: { api: "/api/v1" }
      };
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
