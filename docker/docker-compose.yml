# Full stack: application, PostgreSQL and Redis.
#   docker compose -f docker/docker-compose.yml up --build
# Then open http://localhost:8000 (demo accounts: admin / AdminPass123!, alice / AlicePass123!).

name: flaskversehub

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-compose}
    ports:
      - "${PORT:-8000}:8000"
    environment:
      FLASK_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:-please-change-me-this-is-only-for-local-compose}
      DATABASE_URL: postgresql+psycopg://fvh:${POSTGRES_PASSWORD:-fvh}@db:5432/fvh
      REDIS_URL: redis://redis:6379/0
      CACHE_TYPE: RedisCache
      CACHE_REDIS_URL: redis://redis:6379/1
      RATELIMIT_STORAGE_URI: redis://redis:6379/2
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
      SESSION_COOKIE_SECURE: "false"   # local HTTP; set true behind TLS
      LOG_JSON: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/instance/uploads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fvh
      POSTGRES_USER: fvh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fvh}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fvh -d fvh"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres:
  redis:
  uploads:
