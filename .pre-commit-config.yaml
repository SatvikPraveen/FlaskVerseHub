repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(experiments/results/|.*\.svg$)
      - id: end-of-file-fixer
        exclude: ^(experiments/results/|.*\.svg$)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  # mypy runs from the project environment so it sees the real dependencies,
  # exactly as CI does (`make install` provides it).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
