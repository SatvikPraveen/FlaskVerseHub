name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Lint, types and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - name: Ruff (lint)
        run: ruff check . --output-format github
      - name: Ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: Bandit
        run: bandit -c pyproject.toml -r app -q

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - name: pytest with coverage gate
        run: pytest --cov --cov-report=xml --cov-report=term --junitxml=junit.xml -m "not slow"
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml

  postgres:
    name: Tests against PostgreSQL
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fvh
          POSTGRES_PASSWORD: fvh
          POSTGRES_DB: fvh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt -r requirements/prod.txt && pip install -e . --no-deps
      - name: Apply migrations
        env:
          FLASK_APP: wsgi:app
          FLASK_CONFIG: development
          DEV_DATABASE_URL: postgresql+psycopg://fvh:fvh@localhost:5432/fvh_test
        run: flask db upgrade && flask seed all
      - name: Smoke the application against PostgreSQL
        env:
          FLASK_CONFIG: development
          DEV_DATABASE_URL: postgresql+psycopg://fvh:fvh@localhost:5432/fvh_test
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app("development")
          client = app.test_client()
          for path in ("/", "/health", "/knowledge/", "/api/v1/stats", "/search?q=flask"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
          print("PostgreSQL smoke test passed")
          PY

  benchmark:
    name: Retrieval benchmark
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - name: Reproduce the committed benchmark
        run: python -m experiments.run_retrieval_benchmark --config experiments/configs/default.yaml --out /tmp/bench
      - name: Check reproducibility against committed results
        run: |
          python - <<'PY'
          import json
          committed = json.load(open("experiments/results/results.json"))["systems"]
          fresh = json.load(open("/tmp/bench/results.json"))["systems"]
          for label, system in committed.items():
              assert fresh[label]["aggregate"] == system["aggregate"], label
          print(f"{len(committed)} systems reproduced exactly")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: /tmp/bench

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: flaskversehub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the image
        run: |
          docker run -d --name fvh -p 8000:8000 \
            -e SECRET_KEY=ci-secret-key-ci-secret-key-ci-secret-key \
            -e DATABASE_URL=sqlite:////tmp/fvh.db \
            -e CACHE_TYPE=SimpleCache -e RATELIMIT_STORAGE_URI=memory:// \
            flaskversehub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs fvh
          exit 1
