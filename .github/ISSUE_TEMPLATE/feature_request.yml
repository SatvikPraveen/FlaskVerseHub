name: Feature request
description: Propose an enhancement or a new experiment
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the change. For retrieval work, say which metric you expect to move and how you would measure it.
    validations:
      required: true
